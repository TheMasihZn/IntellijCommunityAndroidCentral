name: Linux image

# Builds apkintellij-linux-<version>.tar.xz: Debian arm64 with the display server and libraries
# IntelliJ needs. Users copy it anywhere on the phone once; app updates don't need it again.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-rootfs.sh'
      - '.github/workflows/linux-image.yml'
  pull_request:
    paths:
      - 'scripts/build-rootfs.sh'
      - '.github/workflows/linux-image.yml'

concurrency:
  group: linux-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build image
        id: build
        env:
          IMAGE_VERSION: ${{ github.run_number }}
        run: ./scripts/build-rootfs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apkintellij-linux-image
          path: out/*.tar.xz
          compression-level: 0
          retention-days: 30

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "linux-image-${{ github.run_number }}" out/*.tar.xz \
            --repo "${{ github.repository }}" --title "Linux image ${{ github.run_number }}" \
            --notes "Copy this file to the phone (Download or an APKintellij folder) and install it from the app's setup screen."
