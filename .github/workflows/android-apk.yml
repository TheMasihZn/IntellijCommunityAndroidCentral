name: Android APK

# Builds the small app APK (no Linux or IntelliJ inside). The Linux image comes from the
# "Linux image" workflow and IntelliJ is built from source in TheMasihZn/APKintellij and released
# here as ide-*; the app installs both from files on the phone.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/fetch-proot.sh'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/fetch-proot.sh'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf

      - name: Fetch proot for Android
        run: ./scripts/fetch-proot.sh

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p out
          file="out/APKintellij-$version-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$file"
          ls -lh out
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "tag=apk-v$version-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: APKintellij-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --repo "${{ github.repository }}" --title "App ${{ steps.apk.outputs.tag }}" \
            --notes "Install this APK. It keeps your installed Linux image, IntelliJ and projects."
